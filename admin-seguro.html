<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mesa técnica · Senshi Bolivia</title><link rel="stylesheet" href="css/main.css"><style>body{background:#f2f5fa;padding:24px}.wrap{max-width:900px;margin:auto}.card{background:#fff;padding:20px;border-radius:12px;margin:12px 0;border:1px solid #dce3ef}.hide{display:none}.row{padding:12px 0;border-bottom:1px solid #e4e8ef}.error{color:#991f1f}.muted{color:#63758d}</style></head><body><main class="wrap"><section class="card"><h1>架真 Mesa técnica</h1><p class="muted">Revisión de atletas e inscripciones.</p></section><section id="login" class="card"><input id="email" placeholder="Correo administrador" type="email"><input id="password" placeholder="Contraseña" type="password"><button class="btn bgold" id="enter">Ingresar</button><p id="error" class="error"></p></section><section id="panel" class="hide"><div class="card"><button class="btn bred" id="exit">Salir</button><h2>Inscripciones</h2><div id="rows">Cargando…</div></div></section></main><script type="module">import{firebaseConfig}from'./firebase/secure-config.js';import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';import{getDatabase,ref,onValue,update}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';const $=id=>document.getElementById(id);if(firebaseConfig.apiKey==='REEMPLAZAR'){$('error').textContent='Completa firebase/secure-config.js';}else{const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);$('enter').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){$('error').textContent=e.message}};$('exit').onclick=()=>signOut(auth);onAuthStateChanged(auth,u=>{if(!u)return $('panel').classList.add('hide');onValue(ref(db,'admins/'+u.uid),admin=>{if(!admin.val()){ $('error').textContent='Tu cuenta no tiene permiso de mesa técnica.';return;} $('login').classList.add('hide');$('panel').classList.remove('hide');onValue(ref(db,'registrations'),regs=>onValue(ref(db,'athletes'),ath=>{const a=ath.val()||{},r=regs.val()||{};$('rows').innerHTML=Object.entries(r).map(([id,x])=>`<div class="row"><b>${a[id]?.name||'Atleta'}</b><br><span class="muted">${x.status||'pending'}</span> <button data-id="${id}" data-status="approved">Aprobar</button> <button data-id="${id}" data-status="rejected">Rechazar</button></div>`).join('')||'Sin inscripciones';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>update(ref(db,'registrations/'+b.dataset.id),{status:b.dataset.status,reviewedAt:new Date().toISOString()}));}));});});}</script></body></html>
